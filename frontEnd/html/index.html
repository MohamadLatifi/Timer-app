<!DOCTYPE html>
<html lang="fa" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/frontEnd/style/style.css">
  <title>Timer</title>
</head>

<body>

  <div class="background"></div>

  <div class="first_timer">

    <div class="form_div" id="formDiv">
      <span class="title_form" id="titleForm"> Timer name :</span>
       <input type="text" class="input_form" id="inputForm">
       <button class="inter_btn" id="interBtn">inter</button>
    </div>

    

    <div class="ring_div">
      <div class="ring">
        <span>00:00:00</span>
      </div>
    </div>


    <div class="time_input_div">
      <span class="hour" id="hour">
        <input type="text" class="time_input">
        <span>Hour</span>
      </span>
    </div>


    <div class="time_input_div">
      <span class="minute" id="minute">
        <input type="text" class="time_input">
        <span>Min</span>
      </span>
    </div>


    <div class="time_input_div">
      <span class="second" id="second">
        <input type="text" class="time_input">
        <span>Sec</span>
      </span>
    </div>



    <div class="subimt_div">
      <button id="submit" class="submit">start</button>

      <button id="submit" class="restart">restart</button>
    </div>
  </div>
  <script defer src="/frontEnd/logic/script.js"></script>

</body>

</html>
