<!DOCTYPE html>
<html lang="fa" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/frontEnd/style/style.css">
  <title>Timer</title>
</head>

<body>
  <div class="first-timer">
    <form>
      h :
      <input type="text" class="hour_input" id="hourInput" >
      m :
      <input type="text" class="minute_input" id="minuteInput" >
      s :
      <input type="text" class="second_input" id="secondInput" >
      <input type="button" id="submit" style="background-color: orange;">
    </form>
    <br>
    <div class="output">
      <!-- day :
      <span class="day" id="day">00</span> -->
      hour :
      <span class="hour" id="hour">00</span>
      minute :
      <span class="minute" id="minute">00</span>
      second :
      <span class="second" id="second"> 00</span>
    </div>
    <script defer src="/frontEnd/logic/script.js"></script>
</body>

</html>
